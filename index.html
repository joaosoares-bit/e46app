<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>E46 Monitor</title>
<style>
:root{--blue:#1c69d4;--bg:#0b0d10;--card:#15181d;--txt:#e8ecf1;--dim:#7d8794;--ok:#2ecc71;--warn:#f5a623;--bad:#e7222e}
*{box-sizing:border-box;margin:0;font-family:-apple-system,Helvetica,sans-serif}
body{background:var(--bg);color:var(--txt);padding:env(safe-area-inset-top) 14px 30px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0;gap:8px}
.stripe{height:4px;background:linear-gradient(90deg,#81c4ff 33%,#16588e 33% 66%,#e7222e 66%);border-radius:2px;margin-bottom:14px}
h1{font-size:20px;font-weight:300;letter-spacing:2px}
button{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:10px 14px;font-size:15px}
button.rec{background:var(--bad)}button.grey{background:#333}
#status{color:var(--dim);font-size:13px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:10px;padding:14px;border-top:2px solid var(--blue)}
.big{grid-column:span 2}
.lbl{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.val{font-size:34px;font-weight:200;margin-top:6px}
.big .val{font-size:56px}
.unit{font-size:14px;color:var(--dim);margin-left:4px}
.sub{font-size:12px;color:var(--dim);margin-top:4px}
.bar{height:6px;background:#222;border-radius:3px;margin-top:10px;overflow:hidden}
.bar div{height:100%;background:var(--blue);width:0;transition:width .2s}
.hot .val{color:var(--bad)}.hot .bar div{background:var(--bad)}
.sec{margin-top:14px}
.row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #222;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;margin-top:4px;flex:none}
.row b{font-weight:500}.row small{color:var(--dim);display:block;margin-top:2px}
</style></head><body>
<header><h1>E46 320d</h1><div style="display:flex;gap:8px"><button id="recBtn" class="grey">Gravar</button><button id="btn">Ligar</button></div></header>
<div class="stripe"></div>
<div id="status">Desligado</div>
<div class="grid" id="grid"></div>
<div class="card big sec"><div class="lbl">Análise de sensores</div><div id="analysis" style="margin-top:6px;color:var(--dim);font-size:14px">Grava uma volta (idealmente a começar com o motor frio) e pára a gravação para ver a análise.</div>
<div style="margin-top:10px"><button id="csvBtn" class="grey">Exportar CSV</button></div></div>
<div class="card big sec"><div class="lbl">Códigos de falha</div><div id="dtcList" style="color:var(--dim);font-size:14px;margin-top:8px">—</div>
<div style="margin-top:10px;display:flex;gap:8px"><button id="readDtc">Ler</button><button id="clrDtc" class="grey">Apagar</button></div></div>
<script>
// Turbo em bar ABSOLUTOS: o PID 0B do OBD só lê até 2,55 bar absolutos.
const SENS=[
{pid:'0B',id:'boost',lbl:'Pressão turbo (abs.)',unit:'bar',big:1,max:2.6,warn:2.5,f:b=>b[0]/100,d:2},
{pid:'05',id:'ect',lbl:'Água',unit:'°C',max:120,warn:105,f:b=>b[0]-40,d:0},
{pid:'0F',id:'iat',lbl:'Ar admissão',unit:'°C',max:60,warn:30,f:b=>b[0]-40,d:0},
{pid:'5C',id:'oil',lbl:'Óleo',unit:'°C',max:150,warn:130,f:b=>b[0]-40,d:0},
{pid:'46',id:'amb',lbl:'Ambiente',unit:'°C',max:50,f:b=>b[0]-40,d:0},
{pid:'3C',id:'egt',lbl:'Escape',unit:'°C',max:900,warn:750,f:b=>(b[0]*256+b[1])/10-40,d:0},
{pid:'10',id:'maf',lbl:'Caudal de ar',unit:'g/s',max:250,f:b=>(b[0]*256+b[1])/100,d:1},
{pid:'04',id:'load',lbl:'Carga motor',unit:'%',max:100,f:b=>b[0]*100/255,d:0},
{pid:'42',id:'volt',lbl:'Bateria',unit:'V',max:16,f:b=>(b[0]*256+b[1])/1000,d:1},
{pid:'0C',id:'rpm',hidden:1,f:b=>(b[0]*256+b[1])/4,d:0},
{pid:'0D',id:'spd',hidden:1,f:b=>b[0],d:0}
];
const DISP=1.995; // cilindrada M47D20 em litros
let baro=101,baroSrc='assumida',keyOn=null,peak=0,wc,buf='',resolver,active=[],q=Promise.resolve();
let vals={},rec=false,log=[];
const $=id=>document.getElementById(id),st=t=>$('status').textContent=t;
function build(){$('grid').innerHTML=active.filter(s=>!s.hidden).map(s=>`<div class="card ${s.big?'big':''}" id="c_${s.id}"><div class="lbl">${s.lbl}</div><div class="val"><span id="v_${s.id}">—</span><span class="unit">${s.unit}</span></div>${s.id=='boost'?'<div class="sub"><span id="rel">Relativa: —</span> · <span id="peak">Pico: —</span></div>':''}<div class="bar"><div id="b_${s.id}"></div></div></div>`).join('')}
function raw(c,t){return new Promise(r=>{const to=setTimeout(()=>{resolver=null;buf='';r('')},t);resolver=x=>{clearTimeout(to);resolver=null;r(x)};wc.writeValue(new TextEncoder().encode(c+'\r'))})}
function cmd(c,t=2000){const p=q.then(()=>raw(c,t));q=p.catch(()=>{});return p}
function parse(r,pid){const h=r.replace(/[\s>]/g,'').toUpperCase(),i=h.indexOf('41'+pid);if(i<0)return null;return(h.slice(i+4).match(/../g)||[]).map(x=>parseInt(x,16))}
async function supported(){const s=new Set();for(const base of['00','20','40']){const b=parse(await cmd('01'+base,10000),base);if(!b||b.length<4)break;
 for(let i=0;i<32;i++)if(b[i>>3]&(128>>(i&7)))s.add((parseInt(base,16)+i+1).toString(16).toUpperCase().padStart(2,'0'));if(!(b[3]&1))break}return s}
async function connect(){
 if(!navigator.bluetooth){st('Abre isto no Bluefy (iPhone) ou Chrome (Android)');return}
 const sv=['0000fff0-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb','000018f0-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2'];
 st('A procurar ficha…');
 const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:sv});
 const srv=await dev.gatt.connect();let nc;
 for(const s of await srv.getPrimaryServices())for(const c of await s.getCharacteristics()){
  if(c.properties.notify&&!nc)nc=c;if((c.properties.write||c.properties.writeWithoutResponse)&&!wc)wc=c}
 if(!nc||!wc){st('Ficha não compatível');return}
 await nc.startNotifications();
 nc.addEventListener('characteristicvaluechanged',e=>{buf+=new TextDecoder().decode(e.target.value);if(buf.includes('>')){const r=buf;buf='';resolver&&resolver(r)}});
 st('A iniciar ELM327…');
 for(const c of['ATZ','ATE0','ATL0','ATS0','ATH0','ATSP3'])await cmd(c,c=='ATZ'?3000:1500);
 st('A ligar ao carro…');
 const sup=await supported();
 const bb=parse(await cmd('0133'),'33');if(bb){baro=bb[0];baroSrc='sensor'}
 // verificação com ignição ligada e motor parado
 const r=parse(await cmd('010C'),'0C'),m=parse(await cmd('010B'),'0B');
 if(r&&m){const rpm=(r[0]*256+r[1])/4;if(rpm<100){keyOn={map:m[0]};if(!bb){baro=m[0];baroSrc='lida com motor parado'}}}
 active=SENS.filter(s=>sup.has(s.pid));build();
 st(`Ligado — ${active.filter(s=>!s.hidden).length} sensores visíveis`);loop();
}
async function loop(){while(true){for(const s of active){const b=parse(await cmd('01'+s.pid),s.pid);if(!b)continue;const v=s.f(b);vals[s.id]=v;
 if(s.hidden)continue;
 $('v_'+s.id).textContent=(s.id=='boost'&&b[0]>=255?'≥':'')+v.toFixed(s.d);$('b_'+s.id).style.width=Math.max(0,Math.min(100,v/s.max*100))+'%';
 $('c_'+s.id).classList.toggle('hot',!!s.warn&&v>=s.warn);
 if(s.id=='boost'){$('rel').textContent='Relativa: '+(v-baro/100).toFixed(2)+' bar';if(v>peak){peak=v;$('peak').textContent='Pico: '+v.toFixed(2)+' bar'}}}
 if(rec)log.push({t:Date.now(),...vals,mapk:vals.boost!=null?vals.boost*100:null})}}
// ---------- ANÁLISE ----------
const med=a=>{a=a.filter(x=>x!=null&&!isNaN(x)).sort((x,y)=>x-y);return a.length?a[a.length>>1]:null};
function grade(v,okLo,okHi,wLo,wHi){return v>=okLo&&v<=okHi?'ok':(v>=wLo&&v<=wHi?'warn':'bad')}
function analyze(){
 const R=[],add=(n,s,m)=>R.push({n,s,m});
 if(log.length<20){$('analysis').textContent='Poucos dados — grava pelo menos uns minutos.';return}
 const first=log.slice(0,10),dur=(log[log.length-1].t-log[0].t)/60000;
 // 1. Sensor de pressão (MAP) com motor parado
 if(keyOn){const d=Math.abs(keyOn.map-(baroSrc=='sensor'?baro:101));
  add('Sensor de pressão (MAP)',grade(d,0,4,0,8),`Motor parado: ${keyOn.map} kPa vs atmosfera ${baroSrc=='sensor'?baro:'~101'} kPa (dif. ${d.toFixed(0)} kPa)`)}
 else add('Sensor de pressão (MAP)','na','Liga a app com a ignição ligada e o motor parado para testar.');
 // 2. Temperaturas em frio
 const e0=med(first.map(x=>x.ect)),i0=med(first.map(x=>x.iat)),a0=med(first.map(x=>x.amb));
 if(e0!=null&&e0<35){const ref=a0!=null?a0:i0,
  de=Math.abs(e0-ref),di=i0!=null?Math.abs(i0-ref):0;
  add('Temp. água (arranque a frio)',grade(de,0,6,0,12),`Água ${e0.toFixed(0)}°C vs referência ${ref.toFixed(0)}°C`);
  if(i0!=null&&a0!=null)add('Temp. ar admissão (arranque a frio)',grade(di,0,6,0,12),`Admissão ${i0.toFixed(0)}°C vs ambiente ${a0.toFixed(0)}°C`)}
 else add('Temperaturas em frio','na','Motor já estava quente — começa a gravar com o motor frio para testar.');
 // 3. Termóstato / aquecimento
 const eMax=Math.max(...log.map(x=>x.ect??-99));
 if(dur>=10)add('Termóstato / sensor água',eMax>=80&&eMax<=100?'ok':(eMax>=72&&eMax<=105?'warn':'bad'),`Máx. ${eMax.toFixed(0)}°C em ${dur.toFixed(0)} min (normal 85–95°C)`);
 // 4. Medidor de caudal (MAF) vs caudal teórico
 const ve=log.filter(x=>x.rpm>1500&&x.maf>0&&x.mapk>0&&x.iat!=null).map(x=>{
  const theo=(x.mapk*1000*(DISP/1000)*(x.rpm/120))/(287*(x.iat+273))*1000;return x.maf/theo});
 if(ve.length>=15){const v=med(ve);
  add('Medidor de caudal (MAF)',grade(v,0.75,1.05,0.65,1.15),`Rendimento volumétrico ${(v*100).toFixed(0)}% (esperado 75–105%) em ${ve.length} amostras acima de 1500 rpm`)}
 else add('Medidor de caudal (MAF)','na','Precisa de mais tempo acima de 1500 rpm.');
 // 5. Turbo / pressão máxima (absoluta)
 const bMax=Math.max(...log.map(x=>x.boost??-9));
 if(bMax>0)add('Pressão turbo (pico)',bMax<=2.5&&bMax>=1.9?'ok':(bMax<=2.55&&bMax>=1.7?'warn':'bad'),`Pico ${bMax.toFixed(2)} bar absolutos (esperado ~2,0–2,4 com o teu setup)${bMax>=2.55?' · no limite de leitura do OBD':''}`);
 // 6. Carga / alternador
 const vv=med(log.filter(x=>x.rpm>600).map(x=>x.volt));
 if(vv!=null)add('Bateria / alternador',grade(vv,13.6,14.8,13.2,15.0),`${vv.toFixed(2)} V com motor a trabalhar (normal 13,8–14,6 V)`);
 const col={ok:'var(--ok)',warn:'var(--warn)',bad:'var(--bad)',na:'#555'},txt={ok:'OK',warn:'Vigiar',bad:'Avariado?',na:'Sem dados'};
 $('analysis').innerHTML=`<div class="sub">${log.length} amostras · ${dur.toFixed(1)} min</div>`+R.map(r=>`<div class="row"><div class="dot" style="background:${col[r.s]}"></div><div><b>${r.n} — ${txt[r.s]}</b><small>${r.m}</small></div></div>`).join('');
}
function exportCsv(){if(!log.length)return;const k=Object.keys(log[log.length-1]);
 const csv=[k.join(',')].concat(log.map(r=>k.map(x=>r[x]??'').join(','))).join('\n');
 const f=new File([csv],'e46_volta.csv',{type:'text/csv'});
 if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]});
 else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}}
// ---------- DTC ----------
// Lê linha a linha: no ISO 9141-2 cada linha "43…" traz até 3 códigos.
async function readDtc(){if(!wc)return;const r=await cmd('03',5000),L='PCBU',out=[];let seen=false;
 for(const line of r.split(/[\r\n]+/)){const h=line.replace(/[\s>]/g,'').toUpperCase();if(!h.startsWith('43'))continue;seen=true;
  const d=h.slice(2);for(let k=0;k+4<=d.length;k+=4){const c=d.substr(k,4);if(c=='0000')continue;const n=parseInt(c[0],16),code=L[n>>2]+(n&3)+c.slice(1);if(!out.includes(code))out.push(code)}}
 $('dtcList').textContent=out.length?out.join('  '):(seen||/NODATA/.test(r.replace(/\s/g,'').toUpperCase())?'Sem códigos':'Sem resposta — tenta outra vez')}
$('btn').onclick=()=>connect().catch(e=>st('Erro: '+e.message));
$('recBtn').onclick=()=>{rec=!rec;const b=$('recBtn');
 if(rec){log=[];b.textContent='Parar';b.className='rec';$('analysis').textContent='A gravar…'}
 else{b.textContent='Gravar';b.className='grey';analyze()}};
$('csvBtn').onclick=exportCsv;
$('readDtc').onclick=readDtc;
$('clrDtc').onclick=async()=>{if(wc&&confirm('Apagar códigos?')){await cmd('04',5000);readDtc()}};
</script></body></html>
